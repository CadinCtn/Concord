<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vcall — Sala</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ── Overlay de loading ── -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-text">Conectando à sala...</p>
  </div>

  <!-- ── Layout principal ── -->
  <div id="app">

    <!-- Área de vídeos + controles -->
    <div id="video-area">
      <div id="video-grid" data-count="1"></div>

      <!-- Barra de controles inferior -->
      <div id="controls">
        <span id="room-label">Sala: <strong id="room-name-display"></strong></span>

        <!-- Mic -->
        <button class="ctrl-btn active" id="btn-mic" title="Microfone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path id="icon-mic-on" d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
            <path id="icon-mic-off" style="display:none" d="M1 1l22 22M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/>
          </svg>
        </button>

        <!-- Câmera -->
        <button class="ctrl-btn active" id="btn-cam" title="Câmera">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path id="icon-cam-on" d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.899L15 14v-4z"/>
            <rect id="icon-cam-rect" x="2" y="7" width="13" height="10" rx="2"/>
            <line id="icon-cam-off" style="display:none" x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>

        <!-- Compartilhar tela -->
        <button class="ctrl-btn" id="btn-screen" title="Compartilhar tela">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
            <path id="screen-share-arrow" d="M9 9l3-3 3 3M12 6v8"/>
          </svg>
        </button>

        <!-- Sair (encerrar chamada) -->
        <button class="ctrl-btn danger" id="btn-leave" title="Sair da chamada">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.42 19.42 0 0 1 4.5 9.38 19.79 19.79 0 0 1 1.43 .73 2 2 0 0 1 3.43 -1.5h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.4 6.41"/>
            <line x1="23" y1="1" x2="1" y2="23"/>
          </svg>
        </button>

        <!-- Chat toggle -->
        <button class="ctrl-btn" id="btn-chat-toggle" title="Abrir chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span id="chat-badge"></span>
        </button>
      </div>
    </div>

    <!-- Painel de Chat (slide da direita) -->
    <div id="chat-panel">
      <div id="chat-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        Chat da Sala
      </div>

      <div id="chat-messages"></div>

      <div id="chat-input-area">
        <input
          id="chat-input"
          type="text"
          placeholder="Digite uma mensagem..."
          maxlength="1000"
          autocomplete="off"
        />
        <button id="btn-send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script src="/js/mediasoup-bundle.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mediasoupClient.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
